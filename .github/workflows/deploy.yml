# Tests the engine and the app and builds the app. In the public repository it also
# publishes the build to GitHub Pages. The private development repository only tests.
# In the public repository's settings, Pages must use "GitHub Actions" as its source.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The engine has no dependencies, so its tests run before anything is installed.
      - name: Engine tests
        run: node --test
      - name: Install the app's dependencies
        run: npm ci
        working-directory: web
      - name: App tests
        run: npm test
        working-directory: web
      - name: Type check
        run: npm run typecheck
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web
      - uses: actions/configure-pages@v5
        if: ${{ !github.event.repository.private }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !github.event.repository.private }}
        with:
          path: web/dist

  deploy:
    if: ${{ !github.event.repository.private }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
